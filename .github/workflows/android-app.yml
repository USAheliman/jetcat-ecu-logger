# Builds the JetCat Logger Android app on every push that touches the app or the web page,
# and puts the installable file on the "app-latest" release so the phone can download it.
name: Android app

on:
  push:
    paths: [ "android/**", "data/index.html", ".github/workflows/android-app.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Build the app
        working-directory: android/JetCatLogger
        run: |
          EXTRA=""
          if [ -n "${{ vars.ONEDRIVE_CLIENT_ID }}" ]; then EXTRA="-PONEDRIVE_CLIENT_ID=${{ vars.ONEDRIVE_CLIENT_ID }}"; fi
          gradle --no-daemon $EXTRA assembleDebug testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/JetCatLogger.apk"
      - uses: actions/upload-artifact@v4
        with: { name: JetCatLogger-apk, path: JetCatLogger.apk }
      - name: Publish to the app-latest release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y %H:%M') UTC. Install JetCatLogger.apk on the phone."
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest JetCatLogger.apk --clobber
            gh release edit app-latest --notes "$NOTES"
          else
            gh release create app-latest JetCatLogger.apk --title "JetCat Logger app (latest build)" --notes "$NOTES" --prerelease
          fi

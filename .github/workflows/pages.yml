# Publishes the web demo (demo/build.py) to GitHub Pages:
#   https://usaheliman.github.io/jetcat-ecu-logger/
# Runs whenever the pages or the demo data change, so the demo matches the app.
# One-off setup (repo owner): Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Demo site

on:
  push:
    branches: [ main ]
    paths: [ "data/**", "demo/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 demo/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4

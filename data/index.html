<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JetCat Logger</title>
<!-- JetCat ECU Logger web pages. Served by the logger over WiFi, and over Bluetooth
     through the HTTP-over-BLE bridge adapted from Malcolm Messiter's LDRC RXV2.
     Self-contained: no internet needed at the field. GPL-3.0-or-later. -->
<style>
:root{
  --bg:#eef2f8; --card:#fff; --ink:#16202c; --ink2:#566273; --line:#dde3ec; --accent:#2563eb;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626; --band:rgba(37,99,235,.10);
  --rpm:#2563eb; --egt:#e11d48; --pump:#0d9488; --batt:#7c3aed; --set:#94a3b8;
  --hdr1:#1e40af; --hdr2:#0891b2;
  --c-date:#0d9488; --c-type:#7c3aed; --c-bad:#dc2626; --c-warn:#d97706;
  --tint:.12;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1018; --card:#151c27; --ink:#e8edf4; --ink2:#9eabbc; --line:#263042; --accent:#60a5fa;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --band:rgba(96,165,250,.14);
  --rpm:#60a5fa; --egt:#fb7185; --pump:#2dd4bf; --batt:#a78bfa; --set:#64748b;
  --hdr1:#1e3a8a; --hdr2:#0e7490;
  --c-date:#2dd4bf; --c-type:#a78bfa; --c-bad:#f87171; --c-warn:#fbbf24;
  --tint:.20;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--hdr1),var(--hdr2));color:#fff;
  padding:12px 16px 12px;box-shadow:0 2px 10px rgba(15,30,60,.25)}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
header h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#fbbf24;
  margin-right:8px;vertical-align:2px;box-shadow:0 0 0 3px rgba(251,191,36,.3)}
#status{font-size:12.5px;color:rgba(255,255,255,.88);margin-top:3px}
#progress{height:4px;background:rgba(255,255,255,.25);margin-top:8px;border-radius:2px;overflow:hidden;display:none}
#progress div{height:100%;width:0;background:#fbbf24;transition:width .4s}
.btn:disabled{opacity:.45}
.bar{height:6px;background:var(--line);margin:8px 0;border-radius:3px;overflow:hidden}
.bar div{height:100%;background:var(--accent);transition:width .3s}
main{max-width:760px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--ink2);padding:9px 0 11px;font:inherit;font-size:13px;position:relative}
nav button.on{color:var(--accent);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:0 0 14px;
  box-shadow:0 1px 3px rgba(20,40,80,.07);border-top:4px solid var(--sec,var(--line))}
.card h2{font-size:16.5px;margin:0 0 2px;color:var(--sec-ink,var(--ink))}
.card.heli{--sec:var(--hc);--sec-ink:var(--hc)}
.s-blue{--sec:#2563eb}.s-teal{--sec:#0d9488}.s-violet{--sec:#7c3aed}.s-green{--sec:#16a34a}
.s-amber{--sec:#d97706}.s-slate{--sec:#64748b}.s-rose{--sec:#e11d48}.s-indigo{--sec:#4f46e5}
.sub{color:var(--ink2);font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin-top:10px}
.kv .k{font-size:12px;color:var(--ink2)} .kv .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.card.heli .grid .kv{background:color-mix(in srgb,var(--hc) calc(var(--tint)*60%),transparent);border-radius:10px;padding:7px 10px}
.pill{display:inline-block;font-size:12px;font-weight:550;padding:2px 9px;border-radius:99px;color:var(--ink2);margin:3px 4px 0 0;
  background:color-mix(in srgb,var(--ink2) var(--tint)%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) calc(var(--tint)*100%),transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) calc(var(--tint)*100%),transparent)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) calc(var(--tint)*100%),transparent)}
.list{padding:6px 10px}
.list .item{display:flex;justify-content:space-between;gap:10px;padding:10px 8px 10px 12px;margin:6px 0;cursor:pointer;
  border-radius:10px;border-left:5px solid var(--hc,var(--accent));background:color-mix(in srgb,var(--hc,var(--accent)) calc(var(--tint)*45%),transparent)}
.list .item:active{filter:brightness(.96)}
.list .item .hn{color:var(--hc,var(--ink));font-weight:700}
button.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:550}
label.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:550}
button.btn.primary{background:linear-gradient(120deg,var(--hdr1),var(--hdr2));border-color:transparent;color:#fff}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--ink2);margin:8px 0 4px}
.chart{margin:4px 0 10px;position:relative}
.cursor{position:absolute;width:1px;background:var(--ink);opacity:.55;pointer-events:none;display:none}
.chart .t{font-size:13px;font-weight:600;margin:6px 0 2px;display:flex;justify-content:space-between}
.chart .t span{font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums}
canvas{width:100%;height:150px;display:block;touch-action:pan-y}
.empty{color:var(--ink2);text-align:center;padding:24px 8px}
.back{border:0;background:none;color:var(--accent);font:inherit;padding:4px 0 10px}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.chip{--cc:var(--accent);border:1.5px solid color-mix(in srgb,var(--cc) 45%,var(--line));border-radius:99px;padding:5px 13px;
  background:color-mix(in srgb,var(--cc) calc(var(--tint)*40%),transparent);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--cc);border-color:var(--cc);color:#fff;font-weight:650;box-shadow:0 1px 4px color-mix(in srgb,var(--cc) 45%,transparent)}
.fsec{margin-top:10px}
.fsec>.lbl{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--lc,var(--ink2));margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat{border-radius:12px;padding:8px 10px;color:#fff;background:linear-gradient(135deg,var(--s1),var(--s2))}
.stat .k{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
.fdesc{font-size:12.5px;color:var(--ink2);margin:-4px 2px 10px}
.hphoto{margin:-13px -15px 10px;aspect-ratio:16/9;background:center/cover no-repeat;border-radius:10px 10px 0 0;position:relative}
.hphoto.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:linear-gradient(135deg,var(--hc),color-mix(in srgb,var(--hc) 55%,#000));color:#fff}
.hphoto.ph .ini{font-size:54px;font-weight:800;line-height:1;opacity:.9}
.hphoto.ph .hint{font-size:12.5px;opacity:.85;margin-top:6px}
.hphoto .tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;
  font-size:15px;padding:3px 10px;border-radius:8px}
.svc{margin-top:10px;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--svc,var(--good)) calc(var(--tint)*90%),transparent)}
.svc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.svc .big{font-size:18px;font-weight:750;color:var(--svc,var(--good));font-variant-numeric:tabular-nums}
.svc .bar{height:7px;margin:7px 0 2px;background:color-mix(in srgb,var(--ink2) 22%,transparent)}
.svc .bar div{background:var(--svc,var(--good))}
.hedit{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.hedit:first-of-type{border-top:0}
.thumb{width:100%;max-width:320px;aspect-ratio:16/9;border-radius:10px;background:center/cover no-repeat var(--bg);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghead{font-size:13px;font-weight:750;color:var(--gc,var(--ink2));margin:14px 2px 2px;display:flex;justify-content:space-between;
  text-transform:uppercase;letter-spacing:.5px}
.ghead:first-child{margin-top:4px}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
#con{font:12px/1.35 ui-monospace,Consolas,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px;margin:10px 0;height:58vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>JetCat Logger</h1>
  <div id="status">Connecting…</div>
  <div id="progress"><div></div></div>
</header>
<main id="view"></main>
<nav>
  <button data-tab="fleet" class="on">Fleet</button>
  <button data-tab="flights">Flights</button>
  <button data-tab="trends">Trends</button>
  <button data-tab="settings">Settings</button>
  <button data-tab="console">Console</button>
</nav>
<script>
"use strict";
// ---------------------------------------------------------------- data from JetCat's document
// "Serial interface of the JetCat ECU" v1.13, 26 Sep 2006, Tables 3 and 4.
const STATES={0:"Off",1:"Wait for RPM",2:"Ignite",3:"Accelerate",4:"Stabilise",5:"Learn HI",6:"Learn LO",
  8:"Slow down / cooldown",10:"Auto off",11:"Run",12:"Acceleration delay",13:"Speed control",14:"Two-shaft regulate",
  15:"PreHeat 1",16:"PreHeat 2",17:"Main fuel start",19:"Kerosene full on"};
const OFFS={0:"None",1:"Shut down via RC",2:"Overtemperature",3:"Ignition timeout",4:"Acceleration timeout",
  5:"Acceleration too slow",6:"Over RPM",7:"Low RPM off",8:"Low battery",9:"Auto off",10:"Low temperature off",
  11:"High temperature off",12:"Glow plug defective",13:"Watchdog timer",14:"Failsafe off",15:"Manual off (GSU)",
  16:"Power fail",17:"Temp sensor fail",18:"Fuel fail",19:"Prop fail",20:"2nd engine fail",
  21:"2nd engine differential too high",22:"2nd engine no communication"};
// Trend metrics: key in last_run, label, unit, decimals, in-flight only.
// In-flight metrics leave out ground runs (no time at flight throttle, e.g. a bench run to
// idle), which would otherwise plot as 0 and drag the usual range down.
const METRICS=[
  ["mean_flight_pump_v","Pump voltage in flight","V",3,true],
  ["start_s","Start time, ignition to run","s",0,false],
  ["peak_start_egt_c","Peak EGT during start","°C",0,false],
  ["mean_flight_egt_c","Mean EGT in flight","°C",1,true],
  ["max_egt_c","Max EGT in flight","°C",0,true],
  ["mean_flight_rpm","Mean RPM in flight","rpm",0,true],
  ["min_flight_rpm","Lowest RPM in flight","rpm",0,true],
  ["min_start_batt_v","Lowest battery during start","V",2,false],
];
// A flight, not a ground run: some time at flight throttle more than 30 s after Run.
function flew(f){return ((f.last_run||{}).mean_flight_rpm||0)>0;}
const TREND_WINDOW=10, TREND_MIN=5;   // rolling mean ± 2σ of the previous 10 flights, from 5 flights

// ---------------------------------------------------------------- state
let flights=[], helis={}, status=null, tab="fleet", detailKey=null, trendSerial=null;
let heliInfo={}, photos={};   // service details + photo length per ECU serial; photo data URLs (with their length)
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path,opts){
  const r=await fetch(path,Object.assign({cache:"no-store"},opts||{}));
  const ct=r.headers.get("content-type")||"";
  const body=ct.includes("json")?await r.json():await r.text();
  if(!r.ok) throw new Error((body&&body.error)||body||r.status);
  return body;
}
const post=(path,params)=>api(path+(params?"?"+new URLSearchParams(params):""),{method:"POST"});

// How the page is reaching the data: the logger over WiFi or Bluetooth, or (in the phone
// app, with the logger switched off) the copies of the flights kept on the phone.
const IN_APP=!!window.AndroidApp;
// Logger battery (battery build only). The % is a rough guide from a typical 1S LiPo
// resting-voltage curve, not a measurement of charge.
const LIPO_CURVE=[[3300,0],[3500,5],[3600,12],[3700,30],[3800,50],[3900,65],[4000,78],[4100,90],[4200,100]];
function battPct(mv){if(mv>=4200)return 100;if(mv<=3300)return 0;
  for(let i=1;i<LIPO_CURVE.length;i++){const [v1,p1]=LIPO_CURVE[i],[v0,p0]=LIPO_CURVE[i-1];
    if(mv<=v1)return Math.round(p0+(p1-p0)*(mv-v0)/(v1-v0));}return 100;}
function battText(s){const p=s&&s.power;if(!p||!(p.battery_mv>0))return "";
  const c=p.charge==="charging"?" charging":p.charge==="charged"?" charged":"";
  return `battery ${(p.battery_mv/1000).toFixed(2)} V (~${battPct(p.battery_mv)}%)${p.low?" LOW":""}${c}`;}
function viaText(v){return v==="ble"?"Bluetooth":v==="phone"?"Copies on this phone":"WiFi";}
function heliName(serial){return helis[serial]||("ECU "+serial);}
// One colour per heli (by ECU serial, in sorted order), used on its chips, cards and list rows.
const HELI_COLOURS=["#2563eb","#ea580c","#7c3aed","#0d9488","#db2777","#16a34a","#ca8a04","#0891b2"];
// Service hours: engine total from the ECU (latest flight) minus the total at the last service.
function engineHours(serial){const l=bySerial()[serial];return l&&l.length?l[l.length-1].total_run_time_s/3600:null;}
function serviceInfo(serial){
  const i=heliInfo[serial]||{}, tot=engineHours(serial);
  if(i.service_h==null||tot==null)return null;
  const since=Math.max(0,tot-i.service_h), iv=i.interval_h>0?i.interval_h:null;
  const frac=iv?since/iv:null;
  return {since,iv,frac,date:i.service_date,at:i.service_h,
    colour:frac==null?"var(--good)":frac>=1?"var(--bad)":frac>=0.8?"var(--warn)":"var(--good)"};
}
function heliColour(serial){const all=[...new Set(flights.map(f=>f.serial))].sort();
  const i=all.indexOf(serial);return HELI_COLOURS[(i<0?0:i)%HELI_COLOURS.length];}
function flightTime(f){
  const lr=f.last_run||{};
  if(lr.ignition_at) return {date:new Date(lr.ignition_at),exact:true};
  if(f.downloaded_at) return {date:new Date(f.downloaded_at),exact:false};
  return null;
}
function fmtDate(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+" "+
  d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});}
function whenText(f){
  const t=flightTime(f);
  if(!t) return "time unknown";
  return t.exact?fmtDate(t.date):"before "+fmtDate(t.date);
}
function tfmt(v){return v<0?"−"+mmss(-v):mmss(v);}
function nearest(xs,v){let b=0;for(let i=1;i<xs.length;i++)if(Math.abs(xs[i]-v)<Math.abs(xs[b]-v))b=i;return b;}
function mmss(s){if(s==null||s<0)return "–";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function hours(s){return s==null?"–":(s/3600).toFixed(1)+" h";}
function runSecs(f){const lr=f.last_run||{};return (lr.ignition_t>=0&&lr.shutdown_t>=0)?lr.shutdown_t-lr.ignition_t:f.last_run_time_s;}

// Flights grouped per ECU serial (= per heli), oldest first by runs_ok.
function bySerial(){
  const g={};
  for(const f of flights)(g[f.serial]=g[f.serial]||[]).push(f);
  for(const k in g) g[k].sort((a,b)=>a.runs_ok-b.runs_ok);
  return g;
}
function missedFlights(list){let n=0;for(let i=1;i<list.length;i++){const d=list[i].runs_ok-list[i-1].runs_ok;if(d>1)n+=d-1;}return n;}

// Trend flags: value outside mean ± 2σ of the previous TREND_WINDOW flights.
function trendSeries(list,key){
  const inFlight=(METRICS.find(m=>m[0]===key)||[])[4];
  const pts=list.filter(f=>!inFlight||flew(f)).map(f=>({f,v:(f.last_run||{})[key]})).filter(p=>p.v!=null&&p.v>=0);
  for(let i=0;i<pts.length;i++){
    const prev=pts.slice(Math.max(0,i-TREND_WINDOW),i).map(p=>p.v);
    if(prev.length>=TREND_MIN){
      const m=prev.reduce((a,b)=>a+b,0)/prev.length;
      const sd=Math.sqrt(prev.reduce((a,b)=>a+(b-m)*(b-m),0)/(prev.length-1));
      pts[i].m=m;pts[i].lo=m-2*sd;pts[i].hi=m+2*sd;
      pts[i].flag=pts[i].v<pts[i].lo||pts[i].v>pts[i].hi;
    }
  }
  return pts;
}
function flagsFor(f,list){
  const out=[];
  for(const [k,label] of METRICS){const p=trendSeries(list,k).find(p=>p.f===f);if(p&&p.flag)out.push(label);}
  return out;
}

// ---------------------------------------------------------------- flight filters
// Flights tab filters. Heli and date also apply to the Trends tab; the CSV export on the
// Flights tab exports what is shown. Remembered in this browser / the app between visits.
const FILTER_DEFAULT={heli:"all",date:"all",from:"",to:"",type:"all",
  only:{flagged:false,abnormal:false,failsafe:false,nolog:false},
  q:"",sort:"newest",group:"none",minRun:"",minEgt:"",minStart:"",ambLo:"",ambHi:"",more:false,open:true};
let flt=loadFilter();
function loadFilter(){
  try{const v=JSON.parse(localStorage.getItem("jcl.filter")||"null");
    if(v)return Object.assign({},FILTER_DEFAULT,v,{only:Object.assign({},FILTER_DEFAULT.only,v.only||{})});}catch(e){}
  return JSON.parse(JSON.stringify(FILTER_DEFAULT));
}
function saveFilter(){try{localStorage.setItem("jcl.filter",JSON.stringify(flt));}catch(e){}}
const isAbnormal=f=>f.session_values_valid&&f.off_condition&&f.off_condition!==1;
const hadFailsafe=f=>f.session_values_valid&&f.failsafe_count>0;
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dateOk(f){
  if(flt.date==="all")return true;
  const t=flightTime(f); if(!t)return false;
  const d=t.date, now=new Date();
  if(flt.date==="today")return dayStart(d).getTime()===dayStart(now).getTime();
  if(flt.date==="7d")return d>=new Date(dayStart(now).getTime()-6*86400000);
  if(flt.date==="month")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(flt.date==="custom"){
    if(flt.from&&d<new Date(flt.from+"T00:00:00"))return false;
    if(flt.to&&d>=new Date(new Date(flt.to+"T00:00:00").getTime()+86400000))return false;
    return true;
  }
  return true;
}
const heliOk=f=>flt.heli==="all"||f.serial===flt.heli;
function filteredFlights(){
  const g=bySerial(), q=flt.q.trim().toLowerCase();
  const minRun=num(flt.minRun), minEgt=num(flt.minEgt), minStart=num(flt.minStart), aLo=num(flt.ambLo), aHi=num(flt.ambHi);
  const out=flights.filter(f=>{
    const lr=f.last_run||{};
    if(!heliOk(f)||!dateOk(f))return false;
    if(flt.type==="flights"&&!flew(f))return false;
    if(flt.type==="ground"&&flew(f))return false;
    if(flt.only.flagged&&!flagsFor(f,g[f.serial]).length)return false;
    if(flt.only.abnormal&&!isAbnormal(f))return false;
    if(flt.only.failsafe&&!hadFailsafe(f))return false;
    if(flt.only.nolog&&f.log_status==="full")return false;
    if(q&&![heliName(f.serial),f.serial,String(f.runs_ok),f.key].some(v=>String(v).toLowerCase().includes(q)))return false;
    if(minRun!=null&&!(runSecs(f)>=minRun*60))return false;
    if(minEgt!=null&&!(lr.max_egt_c>=minEgt))return false;
    if(minStart!=null&&!(lr.start_s>=minStart))return false;
    if(aLo!=null&&!(f.ambient_c>=aLo))return false;
    if(aHi!=null&&!(f.ambient_c<=aHi))return false;
    return true;
  });
  const tm=f=>{const t=flightTime(f);return t?t.date.getTime():0;};
  const by={newest:(a,b)=>tm(b)-tm(a)||b.runs_ok-a.runs_ok,
    longest:(a,b)=>runSecs(b)-runSecs(a),
    egt:(a,b)=>(b.last_run.max_egt_c||0)-(a.last_run.max_egt_c||0),
    start:(a,b)=>(b.last_run.start_s??-1)-(a.last_run.start_s??-1),
    run:(a,b)=>a.serial.localeCompare(b.serial)||b.runs_ok-a.runs_ok};
  return out.sort(by[flt.sort]||by.newest);
}
function filterActive(){
  const d=FILTER_DEFAULT;
  return flt.heli!==d.heli||flt.date!==d.date||flt.type!==d.type||Object.values(flt.only).some(Boolean)||flt.q.trim()||
    ["minRun","minEgt","minStart","ambLo","ambHi"].some(k=>num(flt[k])!=null);
}
function dateText(){
  return {all:"",today:"today","7d":"last 7 days",month:"this month",
    custom:(flt.from||flt.to)?`${flt.from||"…"} to ${flt.to||"…"}`:""}[flt.date]||"";
}
function hms(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`;}
function totalRun(list){return list.reduce((a,f)=>a+Math.max(0,runSecs(f)||0),0);}
function summaryText(list){
  const bits=[];
  if(flt.heli!=="all")bits.push(heliName(flt.heli));
  if(dateText())bits.push(dateText());
  if(flt.type!=="all")bits.push(flt.type==="flights"?"flights only":"ground runs only");
  const approx=list.some(f=>{const t=flightTime(f);return flt.date!=="all"&&t&&!t.exact;});
  return `Showing ${list.length} of ${flights.length} flight${flights.length===1?"":"s"} · total run time ${hms(totalRun(list))}`+
    (bits.length?" · "+bits.join(", "):"")+(approx?" · some dates are download dates (approx.)":"");
}
// Chip and control handlers. Chips re-render the page; typing only redraws the list, so

function toggleOnly(k){flt.only[k]=!flt.only[k];saveFilter();render();}
function typeF(k,v){flt[k]=v;saveFilter();const el=$("#flist");if(el){el.innerHTML=flightListHtml();}}
function clearFilters(){const more=flt.more,open=flt.open;flt=JSON.parse(JSON.stringify(FILTER_DEFAULT));flt.more=more;flt.open=open;saveFilter();render();}
// One line describing the active filters, for the folded panel.
function activeText(){
  const b=[];
  if(flt.heli!=="all")b.push(heliName(flt.heli));
  if(dateText())b.push(dateText());
  if(flt.type!=="all")b.push(flt.type==="flights"?"flights":"ground runs");
  const o={flagged:"trend flags",abnormal:"abnormal shutdown",failsafe:"failsafe",nolog:"no log"};
  for(const k in o)if(flt.only[k])b.push(o[k]);
  if(flt.q.trim())b.push(`"${flt.q.trim()}"`);
  if(["minRun","minEgt","minStart","ambLo","ambHi"].some(k=>num(flt[k])!=null))b.push("ranges");
  return b.length?b.join(" · "):"none";
}

// ---------------------------------------------------------------- charts (no libraries)
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
// Gridline values on round numbers: 1, 2 or 5 x a power of ten (or a step from `steps`),
// at least `minStep` apart, so each label sits exactly on its line.
function niceTicks(lo,hi,n,minStep,steps){
  const raw=(hi-lo)/n;
  let step=steps?steps.find(s=>s>=raw):null;
  if(!step){const p=Math.pow(10,Math.floor(Math.log10(raw)));step=[1,2,5,10].map(m=>m*p).find(s=>s>=raw-1e-12);}
  if(minStep&&step<minStep)step=minStep;
  const out=[];for(let v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(9));
  return out;
}
const TIME_STEPS=[1,2,5,10,15,30,60,120,300,600,900,1800,3600];
function drawChart(canvas,opt){
  // opt: {x:[], series:[{y:[],color,dash}], band:{lo:[],hi:[]}, marks:[{i,color}], yfmt, xfmt, points,
  //       ystep, xstep (smallest gridline spacing), xsteps (allowed spacings, e.g. TIME_STEPS)}
  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth, H=canvas.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const c=canvas.getContext("2d");c.scale(dpr,dpr);
  const L=46,R=8,T=8,B=20,pw=W-L-R,ph=H-T-B;
  const xs=opt.x; if(!xs.length){return;}
  const allX=[xs,...opt.series.filter(s=>s.x).map(s=>s.x)];
  let ymin=Infinity,ymax=-Infinity;
  for(const s of opt.series)for(const v of s.y)if(v!=null){ymin=Math.min(ymin,v);ymax=Math.max(ymax,v);}
  if(opt.band)for(let i=0;i<xs.length;i++){if(opt.band.lo[i]!=null){ymin=Math.min(ymin,opt.band.lo[i]);ymax=Math.max(ymax,opt.band.hi[i]);}}
  if(!isFinite(ymin)){return;}
  if(ymin===ymax){ymin-=1;ymax+=1;}
  const pad=(ymax-ymin)*0.08,lo0=ymin>=0;ymin-=pad;ymax+=pad;if(lo0&&ymin<0)ymin=0;
  // One flight (or all x equal): centre it with one unit either side.
  let x0=Infinity,x1=-Infinity;for(const a of allX)for(const v of a){if(v<x0)x0=v;if(v>x1)x1=v;}
  const same=x1===x0, xmin=same?x0-1:x0, xmax=same?x0+1:x1;
  const X=v=>L+(v-xmin)/(xmax-xmin)*pw, Y=v=>T+(1-(v-ymin)/(ymax-ymin))*ph;
  c.font="11px system-ui,sans-serif";c.fillStyle=css("--ink2");c.strokeStyle=css("--line");c.lineWidth=1;
  for(const v of niceTicks(ymin,ymax,4,opt.ystep)){const y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();
    c.textAlign="right";c.fillText(opt.yfmt(v),L-6,y+4);}
  const xt=niceTicks(xmin,xmax,4,opt.xstep,opt.xsteps);
  xt.forEach((v,i)=>{const x=X(v);c.textAlign=x<L+12?"left":x>W-R-12?"right":"center";c.fillText(opt.xfmt(v),x,H-5);});
  if(opt.band){c.fillStyle=css("--band");c.beginPath();let started=false;
    for(let i=0;i<xs.length;i++)if(opt.band.lo[i]!=null){const x=X(xs[i]),y=Y(opt.band.hi[i]);started?c.lineTo(x,y):c.moveTo(x,y);started=true;}
    for(let i=xs.length-1;i>=0;i--)if(opt.band.lo[i]!=null)c.lineTo(X(xs[i]),Y(opt.band.lo[i]));
    if(started){c.closePath();c.fill();}}
  for(const s of opt.series){const sx=s.x||xs;c.globalAlpha=s.alpha??1;
    c.strokeStyle=s.color;c.lineWidth=s.width||1.6;c.setLineDash(s.dash||[]);c.beginPath();
    let pen=false;s.y.forEach((v,i)=>{if(v==null){pen=false;return;}const x=X(sx[i]),y=Y(v);pen?c.lineTo(x,y):c.moveTo(x,y);pen=true;});
    c.stroke();c.setLineDash([]);c.globalAlpha=1;
    if(opt.points)s.y.forEach((v,i)=>{if(v==null)return;c.fillStyle=s.color;c.beginPath();c.arc(X(xs[i]),Y(v),3,0,7);c.fill();});}
  for(const m of opt.marks||[]){const s=opt.series[0];c.strokeStyle=m.color;c.lineWidth=2;c.beginPath();c.arc(X(xs[m.i]),Y(s.y[m.i]),6,0,7);c.stroke();}
  canvas._map={xmin,xmax,L,pw,T,ph};   // for the tap/drag cursor
}
function chartBlock(title,id){return `<div class="chart"><div class="t">${esc(title)}<span id="${id}-v"></span></div><canvas id="${id}"></canvas></div>`;}
// Linked cursor: tap or drag on any chart in the group and a vertical line appears at that
// moment on every chart, each showing its own value in its title line.
function linkedHover(xs,items){   // items: [{canvas, fn(i) -> text}]
  items=items.filter(it=>it.canvas&&it.canvas._map);
  for(const it of items){
    const ch=it.canvas.parentElement;let ln=ch.querySelector(".cursor");
    if(!ln){ln=document.createElement("div");ln.className="cursor";ch.appendChild(ln);}
    it.line=ln;
  }
  const show=i=>{for(const it of items){const m=it.canvas._map,X=m.L+(xs[i]-m.xmin)/(m.xmax-m.xmin)*m.pw;
    it.line.style.left=(it.canvas.offsetLeft+X)+"px";it.line.style.top=(it.canvas.offsetTop+m.T)+"px";
    it.line.style.height=m.ph+"px";it.line.style.display="block";
    $("#"+it.canvas.id+"-v").textContent=it.fn(i);}};
  for(const it of items){
    const cv=it.canvas;
    const pick=e=>{const r=cv.getBoundingClientRect(),m=cv._map,px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
      const f=Math.min(1,Math.max(0,(px-m.L)/m.pw));show(nearest(xs,m.xmin+f*(m.xmax-m.xmin)));};
    cv.addEventListener("mousemove",pick);cv.addEventListener("touchstart",pick,{passive:true});
    cv.addEventListener("touchmove",pick,{passive:true});
  }
}
// Tap/drag on a chart shows the value at that point in its title line.
function hover(canvas,xs,fn){
  const pick=e=>{const r=canvas.getBoundingClientRect(),px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const L=46,pw=r.width-54,f=Math.min(1,Math.max(0,(px-L)/pw)),xv=xs[0]+f*(xs[xs.length-1]-xs[0]);
    let best=0;for(let i=1;i<xs.length;i++)if(Math.abs(xs[i]-xv)<Math.abs(xs[best]-xv))best=i;
    $("#"+canvas.id+"-v").textContent=fn(best);};
  canvas.addEventListener("mousemove",pick);canvas.addEventListener("touchstart",pick,{passive:true});
  canvas.addEventListener("touchmove",pick,{passive:true});
}

// ---------------------------------------------------------------- views
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const v=$("#view");
  if(tab==="fleet") v.innerHTML=fleetView();
  else if(tab==="flights") v.innerHTML=detailKey?"":flightsView();
  else if(tab==="trends") v.innerHTML=trendsView();
  else if(tab==="console") v.innerHTML=consoleView();
  else v.innerHTML=settingsView();
  if(tab==="flights"&&detailKey) showFlight(detailKey);
  if(tab==="trends") drawTrends();
  if(tab==="console") showConsole(true);
}

function flightListHtml(){
  const list=filteredFlights(), g=bySerial();
  const fl=list.filter(flew).length;
  const head=`<div class="stats">
      <div class="stat" style="--s1:#2563eb;--s2:#4f46e5"><div class="k">Shown</div><div class="v">${list.length} <span style="font-size:13px;opacity:.85">of ${flights.length}</span></div></div>
      <div class="stat" style="--s1:#0d9488;--s2:#0891b2"><div class="k">Run time</div><div class="v">${hms(totalRun(list))}</div></div>
      <div class="stat" style="--s1:#ea580c;--s2:#db2777"><div class="k">Flights</div><div class="v">${fl}${list.length-fl?` <span style="font-size:13px;opacity:.85">+${list.length-fl} gnd</span>`:""}</div></div>
    </div><div class="fdesc" id="fsum">${esc(summaryText(list))}</div>`;
  const exp=list.length?`<div class="btns"><button class="btn" onclick="exportSummary(filteredFlights())">${list.length===1?"Export this flight":`Export ${list.length===flights.length?"all":"these"} ${list.length} flights`} (CSV)</button></div>`:"";
  if(!list.length)return head+`<div class="card empty">No flights match these filters.${filterActive()?` <button class="linkbtn" onclick="clearFilters()">Clear filters</button>`:""}</div>`;
  let body;
  if(flt.group==="none")body=list.map(f=>flightItem(f,g)).join("");
  else{
    const groups=new Map();
    for(const f of list){
      let k,label,gc="";
      if(flt.group==="heli"){k=f.serial;label=heliName(f.serial);gc=heliColour(f.serial);}
      else{const t=flightTime(f);k=t?t.date.getFullYear()*100+t.date.getMonth():-1;
        label=t?t.date.toLocaleDateString(undefined,{month:"long",year:"numeric"}):"Date unknown";}
      if(!groups.has(k))groups.set(k,{label,gc,items:[]});
      groups.get(k).items.push(f);
    }
    body=[...groups.values()].map(gr=>`<div class="ghead"${gr.gc?` style="--gc:${gr.gc}"`:""}><span>${esc(gr.label)}</span><span>${gr.items.length} · ${hms(totalRun(gr.items))}</span></div>`+
      gr.items.map(f=>flightItem(f,g)).join("")).join("");
  }
  return head+`<div class="card list">${body}</div>${exp}`;
}

// ---------------------------------------------------------------- in-flight charts
// RPM, EGT, pump and battery against time for one flight, with the previous flight of the
// same heli as a faint dashed line. Both are lined up on ignition (time 0), so the start
// and the flight can be compared directly; time before ignition is shown as negative.
const csvCache={};
async function flightLog(f){
  if(!csvCache[f.key]) csvCache[f.key]=await api("/api/flight.csv?key="+encodeURIComponent(f.key));
  const rows=csvCache[f.key].trim().split("\n").slice(1).map(l=>l.split(","));
  const t=rows.map(r=>+r[0]), t0=(f.last_run&&f.last_run.ignition_t>=0)?f.last_run.ignition_t:t[0];
  return {x:t.map(v=>v-t0),rpm:rows.map(r=>+r[1]),set:rows.map(r=>+r[2]),egt:rows.map(r=>+r[3]),
          pump:rows.map(r=>+r[4]),st:rows.map(r=>+r[5]),batt:rows.map(r=>+r[8]),fromIgn:!!(f.last_run&&f.last_run.ignition_t>=0)};
}
function previousFlight(f){
  const list=bySerial()[f.serial]||[], i=list.findIndex(x=>x.key===f.key);
  for(let k=i-1;k>=0;k--) if(list[k].log_status==="full") return list[k];
  return null;
}
async function flightCharts(el,f,p){
  if(f.log_status!=="full"){el.innerHTML=`<div class="sub">No log was downloaded for this flight.</div>`;return;}
  try{
    const a=await flightLog(f), pf=previousFlight(f);
    let b=null; if(pf){try{b=await flightLog(pf);}catch(e){}}
    el.innerHTML=chartBlock("RPM and set RPM",p+"-rpm")+chartBlock("EGT",p+"-egt")+chartBlock("Pump voltage",p+"-pump")+chartBlock("Battery",p+"-batt")+
      `<div class="note">Time from ignition${a.fromIgn?"":" (from the start of the log: no start was found)"}.
       ${b?`Faint dashed line: previous flight, run ${pf.runs_ok}.`:"No earlier flight of this heli to compare with yet."}
       Tap or drag on any chart: the line shows the same moment on all four.</div>`;
    const k=v=>Math.round(v/1000)+"k", tx={xfmt:tfmt,xstep:1,xsteps:TIME_STEPS};
    const prev=(key,color)=>b?[{x:b.x,y:b[key],color,dash:[3,3],width:1.2,alpha:.45}]:[];
    drawChart($("#"+p+"-rpm"),{x:a.x,series:[...prev("rpm",css("--rpm")),{y:a.set,color:css("--set"),dash:[4,3],width:1.2},{y:a.rpm,color:css("--rpm")}],yfmt:k,ystep:1000,...tx});
    drawChart($("#"+p+"-egt"),{x:a.x,series:[...prev("egt",css("--egt")),{y:a.egt,color:css("--egt")}],yfmt:v=>Math.round(v),ystep:1,...tx});
    drawChart($("#"+p+"-pump"),{x:a.x,series:[...prev("pump",css("--pump")),{y:a.pump,color:css("--pump")}],yfmt:v=>v.toFixed(2),ystep:0.01,...tx});
    drawChart($("#"+p+"-batt"),{x:a.x,series:[...prev("batt",css("--batt")),{y:a.batt,color:css("--batt")}],yfmt:v=>v.toFixed(2),ystep:0.01,...tx});
    const lab=i=>`${tfmt(a.x[i])} · ${STATES[a.st[i]]||"state "+a.st[i]}`;
    const pv=(i,key,fmt)=>{if(!b)return "";const j=nearest(b.x,a.x[i]);return Math.abs(b.x[j]-a.x[i])<=2?` · prev ${fmt(b[key][j])}`:"";};
    // One cursor across all four charts; each title shows the time, the RPM one the engine state too.
    linkedHover(a.x,[
      {canvas:$("#"+p+"-rpm"),fn:i=>`${lab(i)} · ${a.rpm[i].toLocaleString()} (set ${a.set[i].toLocaleString()})${pv(i,"rpm",v=>v.toLocaleString())}`},
      {canvas:$("#"+p+"-egt"),fn:i=>`${tfmt(a.x[i])} · ${a.egt[i]} °C${pv(i,"egt",v=>v+" °C")}`},
      {canvas:$("#"+p+"-pump"),fn:i=>`${tfmt(a.x[i])} · ${a.pump[i].toFixed(2)} V${pv(i,"pump",v=>v.toFixed(2)+" V")}`},
      {canvas:$("#"+p+"-batt"),fn:i=>`${tfmt(a.x[i])} · ${a.batt[i].toFixed(2)} V${pv(i,"batt",v=>v.toFixed(2)+" V")}`}]);
  }catch(e){el.innerHTML=`<div class="sub">Could not load the log: ${esc(e.message)}</div>`;}
}

function drawTrends(){
  const list=trendList();
  if(list.length===1){const el=$("#tf-charts");if(el)flightCharts(el,list[0],"tf");return;}
  for(const [key,label,unit,dp] of METRICS){
    const pts=trendSeries(list,key), cv=$("#t-"+key); if(!cv) continue;
    if(!pts.length){cv.outerHTML=`<div class="note">No flights yet - only ground runs, which are left out of the in-flight charts.</div>`;continue;}
    const x=pts.map(p=>p.f.runs_ok);
    drawChart(cv,{x,points:true,series:[{y:pts.map(p=>p.v),color:css("--accent")}],
      band:{lo:pts.map(p=>p.lo??null),hi:pts.map(p=>p.hi??null)},
      marks:pts.map((p,i)=>p.flag?{i,color:css("--bad")}:null).filter(Boolean),
      yfmt:v=>v.toFixed(dp),ystep:Math.pow(10,-dp),xfmt:v=>Math.round(v),xstep:1});
    cv.style.cursor="pointer";
    cv.onclick=e=>{const r=cv.getBoundingClientRect(),L=46,pw=r.width-54,lo=x[0]===x[x.length-1]?x[0]-1:x[0],hi=x[0]===x[x.length-1]?x[0]+1:x[x.length-1];
      openFlight(pts[nearest(x,lo+Math.min(1,Math.max(0,(e.clientX-r.left-L)/pw))*(hi-lo))].f.key);};
    hover(cv,x,i=>`run ${pts[i].f.runs_ok} · ${pts[i].v.toFixed(dp)} ${unit}${pts[i].flag?" · outside usual range":""}`);
  }
}

window.__fwProgress=function(p){fwProg=p;window.__fwBusy=!!p&&(p.phase==="download"||p.phase==="send"||p.phase==="finish");

               :`<div class="note">No firmware for this board in this release.</div>`}</div>`;}).join("")

function installFw(tag,ver){
  const s=status||{};
  if(s.downloading){alert("The logger is downloading from the ECU - wait for it to finish.");return;}
  if(!confirm(`Install firmware ${ver} on the logger?\n\nIt takes about a minute. Keep the phone next to the logger and this screen open. The logger restarts at the end; then tap it in the list to reconnect.`))return;

// ---------------------------------------------------------------- console
// Same commands as the USB serial monitor (type help). Output is fetched in pieces from
// /api/console?since=N, where N counts every byte the logger has printed since boot.
let conText="", conNext=0, conBusy=false;
function consoleView(){
  return `<div class="card s-slate"><h2>Console</h2>
    <div class="sub">Live output from the logger. Commands work as on the USB serial monitor; type <b>help</b> for the list.</div>
    <pre id="con"></pre>
    <div class="row"><input id="cmd" placeholder="command, e.g. status" maxlength="120" autocomplete="off"
      autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')sendCmd()">
      <button class="btn primary" onclick="sendCmd()">Send</button></div></div>`;
}
function showConsole(jump){
  const pre=$("#con"); if(!pre)return;
  const atEnd=jump||pre.scrollTop+pre.clientHeight>=pre.scrollHeight-20;
  pre.textContent=conText;
  if(atEnd)pre.scrollTop=pre.scrollHeight;
}
async function pollConsole(){
  if(conBusy)return; conBusy=true;
  try{
    for(let i=0;i<20;i++){
      const r=await api("/api/console?since="+conNext);
      if(r.first>conNext&&conNext>0)conText+="… (older output no longer held)\n";
      conText+=r.text; conNext=r.next;
      if(conText.length>300000)conText=conText.slice(-200000);
      if(r.next>=r.total)break;
    }
    showConsole(false);
  }catch(e){}finally{conBusy=false;}
}
async function sendCmd(){
  const i=$("#cmd"), c=i.value.trim(); if(!c)return;
  try{await post("/api/console",{cmd:c});i.value="";setTimeout(pollConsole,300);}
  catch(e){toast("Not sent: "+e.message);}
}

// Photo: shrunk on the phone/PC to 640x360 (cropped to fill), JPEG, then sent as base64 in
// chunks - the fuel station's approach, sized for the Fleet card.
function pickPhoto(serial,input){
  const file=input.files&&input.files[0]; if(!file)return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=async()=>{
    try{
      const W=640,H=360,cv=document.createElement("canvas");cv.width=W;cv.height=H;
      const c=cv.getContext("2d"), sc=Math.max(W/img.width,H/img.height), w=img.width*sc, h=img.height*sc;
      c.drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
      const dataUrl=cv.toDataURL("image/jpeg",0.72), b64=dataUrl.split(",")[1];
      const CH=6000, total=Math.ceil(b64.length/CH);
      for(let i=0;i<total;i++){
        toast(`Sending photo… ${Math.round(i/total*100)}%`);
        await api(`/api/photo?serial=${encodeURIComponent(serial)}&chunk=${i}&total=${total}`,
          {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify([b64.substring(i*CH,(i+1)*CH)])});
      }
      heliInfo=await api("/api/heliinfo.json");
      photos[serial]={url:dataUrl,len:(heliInfo[serial]||{}).photo_len||b64.length};
      toast("Photo saved");render();
    }catch(e){toast("Could not save the photo: "+e.message);}
  };
  img.onerror=()=>toast("That file isn't a picture this browser can read");
  img.src=url;
}
async function removePhoto(serial){
  if(!confirm("Remove this heli's photo?"))return;
  try{heliInfo=await post("/api/photo",{serial,delete:"1"});delete photos[serial];toast("Photo removed");render();}
  catch(e){toast("Could not remove: "+e.message);}
}
// Fetch photos that are new or changed (photo_len differs from the copy in memory).
async function loadPhotos(){
  let changed=false;
  for(const [serial,i] of Object.entries(heliInfo)){
    if(!(i.photo_len>0)){if(photos[serial]){delete photos[serial];changed=true;}continue;}
    if(photos[serial]&&photos[serial].len===i.photo_len)continue;
    try{const t=await api("/api/photo?serial="+encodeURIComponent(serial));
      photos[serial]={url:"data:image/jpeg;base64,"+String(t).trim(),len:i.photo_len};changed=true;}catch(e){}
  }
  if(changed&&(tab==="fleet"||tab==="settings"))render();
}
async function saveWifi(){
  try{await post("/api/wifi",{ssid:$("#ws").value.trim(),pass:$("#wp").value});toast("Saved - joining WiFi");}
  catch(e){toast("Could not save: "+e.message);}
}
async function downloadNow(){try{await post("/api/download");toast("Downloading…");}catch(e){toast(e.message);}}
async function deleteFlight(key){
  if(!confirm("Delete this flight from the logger? Export it first if you want to keep it."))return;
  try{await post("/api/delete",{key});detailKey=null;await loadFlights();toast("Deleted");}catch(e){toast(e.message);}
}
function saveFile(name,text){
  if(IN_APP){AndroidApp.saveFile(name,text);return;}   // WebView cannot download a blob: the app shares it
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
async function exportFlight(key){
  try{saveFile(key+".csv",await api("/api/flight.csv?key="+encodeURIComponent(key)));}catch(e){toast(e.message);}
}
function exportSummary(only){
  const cols=["key","serial","heli","runs_ok","starts_failed","when","time_source","run_s","start_s","peak_start_egt_c",
    "max_egt_c","mean_flight_egt_c","mean_flight_rpm","min_flight_rpm","mean_flight_pump_v","max_pump_v","min_start_batt_v",
    "off_condition","failsafe_count","failsafe_time_s","total_run_time_h","ambient_c","log_status"];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[cols.join(",")];
  for(const f of [...(only||flights)].sort((a,b)=>a.serial.localeCompare(b.serial)||a.runs_ok-b.runs_ok)){
    const lr=f.last_run||{}, t=flightTime(f);
    lines.push([f.key,f.serial,heliName(f.serial),f.runs_ok,f.starts_failed,t?t.date.toISOString():"",f.time_source,runSecs(f),
      lr.start_s,lr.peak_start_egt_c,lr.max_egt_c,lr.mean_flight_egt_c,lr.mean_flight_rpm,lr.min_flight_rpm,lr.mean_flight_pump_v,
      lr.max_pump_v,lr.min_start_batt_v,f.session_values_valid?(OFFS[f.off_condition]||f.off_condition):"",
      f.session_values_valid?f.failsafe_count:"",f.session_values_valid?f.failsafe_time_s:"",
      (f.total_run_time_s/3600).toFixed(2),f.ambient_c,f.log_status].map(q).join(","));
  }
  saveFile("jetcat-flights.csv",lines.join("\r\n"));
}
let toastT;
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";
  t.style.cssText="position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:90%";
  document.body.appendChild(t);}t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2500);}

// ---------------------------------------------------------------- loading + status polling
async function loadFlights(){
  [flights,helis,heliInfo]=await Promise.all([api("/api/flights.json"),api("/api/helis.json"),
    api("/api/heliinfo.json").catch(()=>({}))]);   // older firmware has no service/photo details
  render();
  loadPhotos();
}
let wasDownloading=false;
async function pollStatus(){
  if(window.__fwBusy)return;   // a firmware install owns the Bluetooth link
  try{
    status=await api("/api/status.json");
    const p=$("#progress");
    if(status.downloading){
      p.style.display="block";p.firstElementChild.style.width=Math.min(100,status.dump_bytes/46200*100)+"%";
      $("#status").textContent=status.dump_bytes?`Downloading log… ${Math.round(status.dump_bytes/1024)} KB`:"Reading ECU summary…";
    }else{
      p.style.display="none";
      $("#status").textContent=status.via==="phone"?`${status.flights} flight${status.flights===1?"":"s"} on this phone · logger not connected`:
        `${status.flights} flight${status.flights===1?"":"s"} · ${viaText(status.via)}`+(battText(status)?" · "+battText(status):"")+
        (status.state==="Fault"?" · last download failed":"");
    }
    if(wasDownloading&&!status.downloading) await loadFlights();
    wasDownloading=status.downloading;
    // Refresh the settings page, but never while something is being typed into it.
    if(tab==="settings"&&![...document.querySelectorAll("#view input")].some(i=>i===document.activeElement||i.value!==i.defaultValue))render();
  }catch(e){$("#status").textContent="Not connected to the logger";}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab!=="flights")detailKey=null;render();
  if(tab==="console")pollConsole();});
window.addEventListener("resize",()=>{if(tab==="trends")drawTrends();else if(detailKey)showFlight(detailKey);});
(async()=>{
  // The phone sets the logger's clock at every connection.
  try{await post("/api/time",{epoch:Math.floor(Date.now()/1000)});}catch(e){}
  await pollStatus();
  try{await loadFlights();}catch(e){$("#view").innerHTML=`<div class="card empty">Could not reach the logger.<br>${esc(e.message)}</div>`;}
  setInterval(pollStatus,3000);
  setInterval(()=>{if(tab==="console")pollConsole();},1500);
})();
</script>

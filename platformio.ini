[platformio]
default_envs = esp32s3_n16r8

; JetCat ECU Logger - phase 3a (DevKitC test build: Bluetooth + WiFi + OTA)
; Target: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
;
; Upload over USB:   env esp32s3_n16r8  (the normal Upload button)
; Upload over WiFi:  env esp32s3_ota    (once the logger is on your home WiFi)

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; esp32_exception_decoder turns a crash backtrace into file and line numbers;
; log2file saves each monitor session as platformio-device-monitor-*.log in this folder.
monitor_filters = default, time, esp32_exception_decoder, log2file
monitor_echo = yes
monitor_eol = CR

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; The web page is built into the firmware, so LittleFS only ever holds flights.
board_build.embed_txtfiles = data/index.html

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.3
    adafruit/RTClib @ ^2.1.4

; ble_bridge.h uses C++17 inline variables; the Arduino 2.0.x core defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Console and upload on the CH340 UART port (right-hand USB port on the DevKitC-1).
    ; To use the native USB port (GPIO19/20) instead, change this to 1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Silence the core's internal log messages (e.g. LittleFS "does not exist" noise)
    -DCORE_DEBUG_LEVEL=0

; After a USB upload, clear the OTA boot selection so the freshly flashed firmware runs
; (otherwise an earlier over-the-air image in the other slot would keep booting).
; Same idea as the MCP fuel station's clear_otadata.py.
extra_scripts = post:clear_otadata.py

; Firmware upload over home WiFi, like the fuel station: Upload in this environment
; sends .pio/build/esp32s3_ota/firmware.bin to http://jetcat-logger.local/api/ota.
; If .local names don't resolve on your PC, put the logger's IP address here instead
; (shown by the console command "net").
[env:esp32s3_ota]
extends = env:esp32s3_n16r8
upload_protocol = custom
; Windows' curl can't resolve .local names, so this is the logger's IP address
; (console: net). Reserve it in the router's DHCP settings so it doesn't change.
upload_port = 192.168.1.151
extra_scripts = upload_ota.py

; ---------------------------------------------------------------- XIAO ESP32-S3 Plus (battery build)
; Seeed XIAO ESP32-S3 Plus: 16 MB flash, 8 MB octal PSRAM, so the same partition table
; as the DevKitC. Pins and power rules: src/config.h (BOARD_XIAO_PLUS) and src/power.cpp.
; Upload over the XIAO's own USB-C (its console is USB CDC, not a CH340).
[env:xiao_plus]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = default, time, esp32_exception_decoder, log2file
monitor_echo = yes
monitor_eol = CR
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = data/index.html
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.3
    adafruit/RTClib @ ^2.1.4
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_XIAO_PLUS
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:clear_otadata.py

; XIAO over home WiFi. Put the XIAO's own IP address here once it has joined WiFi
; (console: net) and reserve it in the router, as for the DevKitC.
[env:xiao_plus_ota]
extends = env:xiao_plus
upload_protocol = custom
upload_port = 192.168.1.243   ; XIAO battery build, reserve this address on the Orbi
extra_scripts = upload_ota.py

; Host-side unit test of the XLO parser against a real dump:
;   pio test -e native   (needs a PC C++ compiler; not needed for normal use)
[env:native]
platform = native
build_src_filter = -<*> +<xlo_parse.cpp>
test_build_src = yes
build_flags = -std=c++17
